[project]
name = "inclave-eval"
version = "0.1.0"
description = "Accuracy and latency benchmarks for the InClave chat pipeline"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Emre Ulgac", email = "ulgacemre@gmail.com" },
    { name = "Emre Kocyigit", email = "kocyigit.emre.30@gmail.com" },
    { name = "Ibrahim Furkan Gulcan", email = "ibrahimfurkangulcan@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "inclave-core",
    "inclave-cli",
]

[project.scripts]
inclave-eval = "inclave_eval.cli:main"

[tool.uv.sources]
inclave-core = { workspace = true }
inclave-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inclave_eval"]

[tool.mypy]
packages = ["inclave_eval"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "inclave_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "inclave_cli.*"
ignore_missing_imports = true
